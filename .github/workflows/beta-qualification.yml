name: Beta qualification entry (renamed to beta-e2e.yml)
# AnyWear #358: this file is a stub, not an entry. It keeps the retired workflow file name
# resolvable while `AnyWear-Infra` still dispatches it: a dispatch under the old name lands
# here and fails loudly, instead of returning 404 and leaving the Infra `e2e-hold` job with no
# run to observe.
#
# It runs no test, holds no credential, declares no environment and requests no token scope.
# The `workflow_dispatch` inputs mirror the names the dispatchers send — `operation`,
# `trigger`, `expected_service_commit`, `expected_client_commit`, `worker_slot_offset` and
# `dispatched_by` in `AnyWear-Infra`'s `qualification-dispatch.mjs` and
# `schedule-qualification.mjs`, plus the reconcile lookback an operator may add — so a real
# old-name dispatch is accepted and refused for the right reason rather than rejected as an
# unknown input. They are all `string` and all optional for the same reason.
#
# This file is deleted by this issue's step 5, once the dispatcher's rename has merged.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      trigger:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      expected_service_commit:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      expected_client_commit:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      worker_slot_offset:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      dispatched_by:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string
      reconcile_lookback_days:
        description: Retired input, accepted only so an old-name dispatch reaches the refusal
        required: false
        type: string

permissions: {}

jobs:
  renamed:
    name: Refuse a dispatch of the renamed beta-qualification.yml entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Name the new entry and fail
        # One line, one exit: a red run that says what to dispatch instead. Nothing is
        # checked out, installed, assumed or tested here.
        run: |
          echo "::error title=beta-qualification.yml was renamed::This entry was renamed to beta-e2e.yml by anywear-ai/AnyWear#358. Dispatch .github/workflows/beta-e2e.yml instead; nothing ran here."
          echo "### Renamed entry"
          echo
          echo "This workflow file was renamed to \`beta-e2e.yml\` (AnyWear #358)."
          echo "Re-dispatch the gate at \`.github/workflows/beta-e2e.yml\`; this stub ran no test."
          exit 1
